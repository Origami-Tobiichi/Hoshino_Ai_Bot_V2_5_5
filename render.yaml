services:
  - type: web
    name: hoshino-ai-bot
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: "8000"
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: BETABOTZ_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
